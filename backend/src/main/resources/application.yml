spring:
  application:
    name: english-app-backend
  datasource:
    url: jdbc:sqlite:english.db
    driver-class-name: org.sqlite.JDBC
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.community.dialect.SQLiteDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
    # 允许乱序补执行低版本号迁移(历史遗留:云端库已到 V77 后才补提交 V75,默认校验会拒绝启动)
    out-of-order: true
  servlet:
    multipart:
      max-file-size: 8MB
      max-request-size: 9MB

server:
  port: 8080

voice:
  tts:
    cache-enabled: ${TTS_CACHE_ENABLED:true}
    cache-dir: ${TTS_CACHE_DIR:.tts-cache}
  baidu:
    app-id: ${BAIDU_APP_ID:}
    api-key: ${BAIDU_API_KEY:}
    secret-key: ${BAIDU_SECRET_KEY:}
    connect-timeout-ms: ${BAIDU_CONNECT_TIMEOUT_MS:5000}
    read-timeout-ms: ${BAIDU_READ_TIMEOUT_MS:30000}

app:
  child-growth:
    access-key: ${CHILD_GROWTH_ACCESS_KEY:}
  child-photo:
    dir: ${CHILD_PHOTO_DIR:child-photos}
  word-image:
    # 图片访问基址:开发期为后端服务地址,生产期可改为 CDN 域名
    base-url: ${WORD_IMAGE_BASE_URL:}
    # 静态资源路径前缀,对应 static 目录下的子路径
    path-prefix: /images/words
    # 图片文件扩展名(统一 jpg)
    extension: .jpg
