spring:
  application:
    name: english-app-backend
  # 不使用默认内存用户（家长账号走 guardian_credential）
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  datasource:
    url: jdbc:sqlite:english.db
    driver-class-name: org.sqlite.JDBC
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.community.dialect.SQLiteDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
    # 允许乱序补执行低版本号迁移(历史遗留:云端库已到 V77 后才补提交 V75,默认校验会拒绝启动)
    out-of-order: true
  servlet:
    multipart:
      max-file-size: 8MB
      max-request-size: 9MB

server:
  port: 8080
  servlet:
    session:
      timeout: 7d
      cookie:
        http-only: true
        same-site: lax
        # 生产 HTTPS 下设 SESSION_COOKIE_SECURE=true
        secure: ${SESSION_COOKIE_SECURE:false}
  compression:
    enabled: true
    min-response-size: 1024
    mime-types: application/json,text/html,text/css,text/javascript,application/javascript,image/svg+xml

voice:
  tts:
    cache-enabled: ${TTS_CACHE_ENABLED:true}
    cache-dir: ${TTS_CACHE_DIR:.tts-cache}
  baidu:
    app-id: ${BAIDU_APP_ID:}
    api-key: ${BAIDU_API_KEY:}
    secret-key: ${BAIDU_SECRET_KEY:}
    connect-timeout-ms: ${BAIDU_CONNECT_TIMEOUT_MS:5000}
    read-timeout-ms: ${BAIDU_READ_TIMEOUT_MS:30000}

app:
  # 站点所有者邮箱：首次用该邮箱注册时认领默认家庭（id=1）
  owner-email: ${OWNER_EMAIL:}
  agent:
    # 不限 Agent 次数的白名单家庭（家长邮箱，逗号分隔）；改动后重启生效
    unlimited-family-emails: ${AGENT_UNLIMITED_FAMILY_EMAILS:}
    # 答题 / 语音回合令牌签名密钥；未配置时启动随机生成（重启后旧令牌失效）
    quiz-secret: ${AGENT_QUIZ_SECRET:}
    llm:
      # 百炼 OpenAI 兼容模式（北京）；未配置 Key 时生成关闭，只走课程检索
      api-key: ${DASHSCOPE_API_KEY:}
      endpoint: ${AGENT_LLM_ENDPOINT:https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions}
      model: ${AGENT_LLM_MODEL:qwen-flash}
      timeout-ms: 5000
      max-tokens: 400
      temperature: 0.3
      # 单价（分 / 千 token），用于全站试用预算记账；以百炼控制台实际价格为准
      input-cents-per-k-token: ${AGENT_LLM_INPUT_CENTS:0.015}
      output-cents-per-k-token: ${AGENT_LLM_OUTPUT_CENTS:0.15}
    asr:
      # 中文短语音识别供应商：baidu | dashscope（百度密钥沿用 voice.baidu.*）
      provider: ${AGENT_ASR_PROVIDER:baidu}
      connect-timeout-ms: 3000
      read-timeout-ms: 5000
      max-duration-ms: 15000
      baidu:
        dev-pid: 1537
      dashscope:
        api-key: ${DASHSCOPE_API_KEY:}
        # 华北 2（北京）；也可换成 https://{WorkspaceId}.cn-beijing.maas.aliyuncs.com/...
        endpoint: ${DASHSCOPE_ASR_ENDPOINT:https://dashscope.aliyuncs.com/api/v1/services/aigc/multimodal-generation/generation}
        model: qwen3-asr-flash
  child-photo:
    dir: ${CHILD_PHOTO_DIR:child-photos}
  word-image:
    # 图片访问基址:开发期为后端服务地址,生产期可改为 CDN 域名
    base-url: ${WORD_IMAGE_BASE_URL:}
    # 静态资源路径前缀,对应 static 目录下的子路径
    path-prefix: /images/words
    # 图片文件扩展名(统一 jpg)
    extension: .jpg
