# 关键词审核词表（阶段 2，关键词过滤版）。
# 匹配前文本先归一化：全角转半角（NFKC）、英文小写、去掉空格和标点，再做 replacements 替换。
# 词表里只写归一化后的形式（无空格、无标点、小写）。
# 单字词极易误杀（疼→妈妈疼我，操→操场，枪→水枪），不要加单字词；需要时在 patterns 写正则。
# 拿不准一律从严：宁可多拦，再靠反例测试找误杀。

normalize:
  # 同音 / 拆字 / 谐音替换，按表顺序执行。扩展点：发现新变体就往这里加。
  replacements:
    傻b: 傻逼
    煞笔: 傻逼
    沙比: 傻逼
    傻比: 傻逼
    shabi: 傻逼
    卧艹: 卧槽
    我艹: 我操
    我草: 我操
    草泥马: 操你妈
    caonima: 操你妈
    nmsl: 你妈死了
    女干: 奸
    弓虽: 强
    木仓: 枪
    幵: 开
  # 口头夸张说法：判断死亡话题前先删掉，避免“笑死了”被当成死亡话题
  deathIdioms: [笑死, 累死, 热死, 冷死, 饿死, 困死, 渴死, 吓死, 气死, 急死, 烦死, 美死, 忙死, 臭死, 痒死, 疼死, 痛死, 打死, 死机, 死胡同, 死记硬背, 死结]

# 输入侧按以下顺序判断，先命中先返回（顺序决定用哪句固定话术）
categories:
  STRANGER:
    terms: [陌生人, 不认识的人, 不认识的叔叔, 不认识的阿姨, 不认识的大人, 带我走, 带我去他家, 带我去她家, 跟他走, 跟她走, 跟他回家, 跟她回家,
            上他的车, 上她的车, 给我糖吃, 拐走, 拐卖, 人贩子, 抱走我, 网友, 别告诉爸爸妈妈, 不要告诉爸爸妈妈, 别告诉妈妈, 别告诉爸爸,
            不要告诉妈妈, 不要告诉爸爸, 保守秘密, 摸我]
  EMOTION:
    terms: [没人喜欢我, 没有人喜欢我, 都不喜欢我, 没人跟我玩, 没有人跟我玩, 没人和我玩, 没有人和我玩, 没有朋友, 讨厌我, 欺负我, 被欺负, 打了我,
            打我, 骂我, 不想活, 想死, 自杀, 上吊, 活着没意思, 不要我了, 不爱我, 我是多余的]
    patterns:
      - "我(好|很|有点|真|特别)?怕|我.{0,4}(难过|伤心|想哭|哭了|害怕|好怕|不开心|孤单|孤独|心情不好|好生气|很生气|委屈)"
  INJURY:
    # “很疼 / 好疼”不单列：会误杀“妈妈很疼我”；改用下面的结尾正则
    terms: [流血, 出血, 受伤, 摔倒了, 摔伤, 骨折, 肚子疼, 肚子痛, 头疼, 头痛, 牙疼, 牙痛, 疼死, 痛死, 发烧了, 发热了,
            生病了, 我病了, 烫伤, 烫到, 割到, 划破, 被咬了, 呕吐, 晕倒, 喘不过气, 不舒服]
    patterns:
      - "(疼|痛)(啊|呀|哦|了|死了)?(怎么办)?$"
      # 感冒、打针这类词单独出现多是科学问题（为什么会感冒），只在说自己时拦
      - "我.{0,4}(感冒|咳嗽|过敏|发烧|吃药|打针|生病|拉肚子|摔倒)"
  DANGER:
    terms: [玩火, 怎么点火, 我要点火, 自己点火, 玩打火机, 按打火机, 玩火柴, 划火柴, 点火柴, 放火, 烧东西, 跳楼, 从高处跳, 从楼上跳, 往下跳,
            爬窗, 爬阳台, 翻窗, 摸插座, 玩插座, 插座里, 摸电线, 玩电线, 咬电线, 触电, 摸电, 开煤气, 玩煤气, 开燃气, 偷吃药, 吃药片, 喝酒, 抽烟,
            拿刀, 玩刀, 剪刀戳, 爬高, 一个人出门, 自己过马路, 闯红灯, 一个人游泳, 去河边玩, 掐脖子, 塑料袋套头, 玩鞭炮, 点鞭炮, 炸药, 怎么做炸]
  BODY_PRIVACY:
    terms: [隐私部位, 私处, 私密部位, 鸡鸡, 尿尿的地方, 胸部, 乳房, 咪咪, 光屁股, 脱衣服, 脱裤子, 裸体, 光身子, 生孩子, 生宝宝,
            宝宝怎么来的, 宝宝是怎么来的, 宝宝从哪里来, 我从哪里来, 我是怎么来的, 我是从哪里来, 怎么生出来, 怀孕, 做爱, 性交, 性行为, sex, 亲嘴, 下体, 月经, 内裤]
  VIOLENCE_PROFANITY:
    terms: [打架, 打人, 杀人, 杀了你, 杀你, 砍人, 砍死, 打死, 去死, 开枪, 手枪, 枪杀, 炸弹, 血腥, 吃人, 鬼故事, 女鬼, 厉鬼, 恶鬼, 僵尸, 丧尸,
            傻逼, 他妈的, 你妈的, 操你, 我操, 卧槽, 滚开, 你滚, 混蛋, 王八蛋, 贱人, 白痴, 去你的, fuck, shit, bitch, 强奸, 强暴, 暴力,
            恐怖片, 恐怖袭击, 虐待, 你妈死了, 笨蛋, 你好笨, 你真笨, 滚蛋]
    patterns:
      - "^(你)?滚(开)?(吧|啊)?$"   # 单字“滚”只在整句时拦，避免误杀“滚雪球”
  POLITICS_RELIGION:
    terms: [政治, 共产党, 国民党, 主席, 总统, 总理, 习近平, 毛泽东, 台独, 台湾独立, 藏独, 疆独, 港独, 战争, 打仗, 宗教, 上帝, 耶稣, 基督, 佛祖, 菩萨,
            真主, 安拉, 伊斯兰, 穆斯林, 佛教, 道教, 天主教, 法轮功, 邪教, 新闻, 游行, 抗议, 选举, 政府, 六四, 示威, 恐怖分子, 制裁, 拜神, 烧香]
  PROMPT_INJECTION:
    terms: [忽略之前, 忽略以上, 忽略上面, 忽略前面, 忽略所有, 忽略你的, 忘记之前, 忘掉之前, 忘记你的, 你现在是, 你现在扮演, 扮演, 假装你是, 假装自己是,
            角色扮演, 系统提示, 系统指令, 提示词, prompt, 不要遵守, 不用遵守, 无视规则, 无视之前, ignore, jailbreak, 越狱,
            developermode, 开发者模式, 你的设定, 你的规则是, 输出你的, 重复上面, 新的指令, 管理员模式, dan模式]
    patterns:
      - "(?<!solar)system"   # 英语课里的 solar system 不算

death:
  # 出现以下词（去掉 deathIdioms 后）才进入死亡话题判断
  words: [死, 去世, 过世, 逝世, 灭绝, 不在了, 离开我们, 离开了我们, 去天堂, 上天堂, 去了天堂, 再也见不到, 再也看不到, 埋起来, 埋了, 葬礼, 坟]
  # 只出现这些死亡词时，一律视为自然知识
  natureOnlyWords: [灭绝]
  # 自然知识对象：命中且不涉及家人 / 自家宠物 → DEATH_NATURE（允许温和回答）
  natureSubjects: [恐龙, 动物, 植物, 树, 叶, 花, 草, 虫, 蚂蚁, 蝴蝶, 蜜蜂, 鱼, 鸟, 狗, 猫, 兔, 熊, 狮, 虎, 象, 鲸, 鲨, 猛犸, 龙, 细菌, 星星, 太阳,
                   恒星, 蚊子, 苍蝇, 蚕, 青蛙, 蝌蚪, 乌龟, 鸡, 鸭, 牛, 羊, 马, 猪]
  # 家人：和死亡词同时出现 → DEATH_FAMILY
  familySubjects: [爷爷, 奶奶, 外公, 外婆, 姥姥, 姥爷, 爸爸, 妈妈, 哥哥, 姐姐, 弟弟, 妹妹, 叔叔, 阿姨, 舅舅, 姑姑, 伯伯, 太奶奶, 太爷爷, 家人, 亲人,
                   老师, 朋友, 同学]
  # 家人去向问法（6.1 例子“奶奶去哪了”）：家人 + 以下说法，即使没有死亡词也判 DEATH_FAMILY
  # 委婉说法（不醒 / 走了 …）也算；“爸爸走了，去上班了”会被误杀，按从严原则接受
  familyGonePhrases: [去哪了, 去哪里了, 去哪儿了, 怎么不回来, 不回来了, 见不到了, 看不到了, 不醒, 不在了, 去天上, 走了, 离开我们, 离开了我们]
  # 英文：家人词 + 死亡词同时出现 → DEATH_FAMILY；单独的 die 不拦（英语课会讲 dinosaurs died）
  englishFamily: [mom, mum, mommy, mummy, mother, dad, daddy, father, grandpa, grandma, granny, grandad, grandfather, grandmother,
                  brother, sister, uncle, aunt, family]
  englishDeath: [kill, die, dead, death]
  # 自家宠物：所属词 + 宠物同时出现，且有死亡词 → DEATH_FAMILY
  possessives: [我的, 我家, 我们家, 我养的]
  # 宠物 + 以下说法（已经发生的离开），即使没有“我的”也按家里宠物处理
  petGonePhrases: [死了, 死掉, 不动了, 不见了, 埋了]
  pets: [小狗, 狗狗, 小猫, 猫咪, 小鱼, 金鱼, 小兔, 兔子, 仓鼠, 宠物, 小鸟, 鹦鹉, 乌龟, 小龟, 蚕宝宝]

# 仅输出侧（输出出现即拦）。链接 / 邮箱 / 号码另由正则识别。
output:
  # 引导联系、站外跳转 → 记为 PERSONAL_INFO
  contact:
    terms: [问我, 加我, 联系我, 找我, 私信, 微信, weixin, wechat, qq, 扫码, 二维码, 关注, 网址, 网站, 链接, 点击, 下载, 电话, 手机号, 邮箱, email,
            地址是, 购买, 充值, 付款, askme, addme, callme, contactme, followme]
  # 危险物品：讲解里提到就拦（输入侧只拦“玩 / 摸”这类动作，避免误杀“打火机是什么”）→ 记为 DANGER
  danger:
    terms: [打火机, 火柴, 点火, 插座, 电线, 煤气, 燃气, 刀子, 药片, 鞭炮, 汽油]
