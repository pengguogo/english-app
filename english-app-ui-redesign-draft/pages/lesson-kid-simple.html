<!DOCTYPE html>
<html lang="zh-CN" class="light">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>学习页低龄简化版</title>
    <style id="theme-vars">
:root {
  --color-primary: #6b7cff;
  --color-primary-deep: #4f61da;
  --color-primary-soft: #eef2ff;
  --state-success: #55b86f;
  --state-success-soft: #edf8f0;
  --state-warning: #ff9c41;
  --state-warning-soft: #fff3e7;
  --state-error: #ef7878;
  --state-error-soft: #ffefef;
  --state-info: #78a8ef;
  --state-info-soft: #eff6ff;
  --color-ink: #27314d;
  --color-ink-soft: #59627d;
  --color-muted: #8d95ad;
  --color-border: #e6eaf5;
  --color-border-strong: #d7dff0;
  --color-background: #fff8f1;
  --color-background-soft: #fffdf9;
  --color-card: #ffffff;
  --color-card-soft: #f9fbff;
  --color-foreground: var(--color-ink);
  --shadow-card: 0 10px 24px rgba(39, 49, 77, 0.04);
  --shadow-soft: 0 6px 18px rgba(39, 49, 77, 0.035);
  --shadow-press: 0 8px 18px rgba(79, 97, 218, 0.05);
  --radius-xs: 6px;
  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-lg: 16px;
  --radius-pill: 999px;
  --color-radius-sm: var(--radius-sm);
  --color-radius-md: var(--radius-md);
  --color-radius-lg: var(--radius-lg);
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 20px;
  --space-6: 24px;
  --space-8: 32px;
  --space-10: 40px;
  --text-xs: 12px;
  --text-sm: 14px;
  --text-base: 16px;
  --text-md: 18px;
  --text-lg: 24px;
  --text-xl: 30px;
  --font-sans: "PingFang SC", "Noto Sans SC", system-ui, -apple-system, sans-serif;
  --font-weight-medium: 500;
  --font-weight-semibold: 600;
  --font-weight-bold: 700;
  --duration-fast: 150ms;
  --duration-normal: 220ms;
  --ease-smooth: cubic-bezier(0.4, 0, 0.2, 1);
  --primary-gradient: linear-gradient(135deg, #6b7cff 0%, #88a0ff 100%);
  --soft-gradient: linear-gradient(180deg, #fffdf9 0%, #fff5eb 100%);
  --focus-ring: 0 0 0 4px rgba(107, 124, 255, 0.16);
}

*,
*::before,
*::after {
  box-sizing: border-box;
}

html {
  font-size: 16px;
}

body {
  margin: 0;
  min-height: 100vh;
  font-family: var(--font-sans);
  color: var(--color-foreground);
  background: var(--soft-gradient);
}

img {
  display: block;
  max-width: 100%;
}

button,
a {
  color: inherit;
  font: inherit;
}

.app-shell {
  width: min(100%, 800px);
  margin: 0 auto;
  padding: var(--space-4);
}

.mobile-frame {
  min-height: 100vh;
  background: linear-gradient(180deg, rgba(255, 255, 255, 0.74), rgba(255, 255, 255, 0.94)), var(--color-background);
}

.page-stack {
  display: flex;
  flex-direction: column;
  gap: var(--space-4);
  padding-bottom: 110px;
}

.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-3);
  padding: var(--space-3) 0;
}

.back-button,
.ghost-button,
.chip-button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-height: 44px;
  padding: 0 var(--space-4);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-pill);
  background: rgba(255, 255, 255, 0.92);
  text-decoration: none;
  box-shadow: var(--shadow-soft);
}

.page-title {
  margin: 0;
  font-size: var(--text-md);
  font-weight: var(--font-weight-bold);
}

.page-subtitle {
  margin: 2px 0 0;
  color: var(--color-ink-soft);
  font-size: var(--text-sm);
}

.hero-card,
.panel-card,
.lesson-card,
.summary-card,
.option-card,
.unit-card {
  background: var(--color-card);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-card);
}

.hero-card {
  padding: var(--space-5);
}

.section-title {
  margin: 0;
  font-size: 20px;
  font-weight: var(--font-weight-bold);
}

.section-desc {
  margin: var(--space-1) 0 0;
  color: var(--color-ink-soft);
  font-size: var(--text-sm);
}

.stats-row {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: var(--space-3);
}

.stat-card {
  padding: var(--space-3);
  border-radius: var(--radius-md);
  background: var(--color-card-soft);
  border: 1px solid var(--color-border);
}

.stat-label {
  display: block;
  color: var(--color-muted);
  font-size: var(--text-xs);
}

.stat-value {
  display: block;
  margin-top: var(--space-1);
  font-size: var(--text-md);
  font-weight: var(--font-weight-bold);
}

.primary-button,
.action-button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 100%;
  min-height: 52px;
  padding: 0 var(--space-5);
  border: 0;
  border-radius: var(--radius-pill);
  background: var(--primary-gradient);
  color: #ffffff;
  text-decoration: none;
  font-size: var(--text-base);
  font-weight: var(--font-weight-bold);
  box-shadow: var(--shadow-press);
}

.secondary-button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 100%;
  min-height: 48px;
  padding: 0 var(--space-4);
  border: 1px solid var(--color-border-strong);
  border-radius: var(--radius-pill);
  background: #ffffff;
  color: var(--color-primary-deep);
  text-decoration: none;
  font-size: var(--text-sm);
  font-weight: var(--font-weight-bold);
}

.badge {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-height: 28px;
  padding: 0 var(--space-3);
  border-radius: var(--radius-pill);
  font-size: var(--text-xs);
  font-weight: var(--font-weight-bold);
}

.badge-success {
  background: var(--state-success-soft);
  color: var(--state-success);
}

.badge-warning {
  background: var(--state-warning-soft);
  color: var(--state-warning);
}

.badge-info {
  background: var(--state-info-soft);
  color: var(--state-info);
}

.progress-track {
  width: 100%;
  height: 10px;
  overflow: hidden;
  border-radius: var(--radius-pill);
  background: #eef1f8;
}

.progress-fill {
  height: 100%;
  border-radius: var(--radius-pill);
  background: var(--primary-gradient);
}

.simple-mascot {
  position: relative;
  width: 92px;
  height: 92px;
  flex-shrink: 0;
  border-radius: 32px;
  background: linear-gradient(180deg, #f6f8ff 0%, #edf2ff 100%);
  border: 1px solid var(--color-border);
  box-shadow: var(--shadow-soft);
}

.simple-mascot::before,
.simple-mascot::after {
  content: "";
  position: absolute;
  top: 8px;
  width: 22px;
  height: 22px;
  border-radius: 50%;
  background: #d9dfef;
}

.simple-mascot::before {
  left: 12px;
}

.simple-mascot::after {
  right: 12px;
}

.simple-mascot-face {
  position: absolute;
  inset: 18px 14px 10px;
  border-radius: 28px 28px 24px 24px;
  background: #f3f6ff;
  border: 1px solid #e2e8f5;
}

.simple-mascot-eye {
  position: absolute;
  top: 22px;
  width: 10px;
  height: 14px;
  border-radius: 999px;
  background: var(--color-ink);
}

.simple-mascot-eye.left {
  left: 22px;
}

.simple-mascot-eye.right {
  right: 22px;
}

.simple-mascot-nose {
  position: absolute;
  top: 42px;
  left: 50%;
  width: 14px;
  height: 10px;
  border-radius: 999px;
  background: #ffb8b8;
  transform: translateX(-50%);
}

.simple-mascot-smile {
  position: absolute;
  left: 50%;
  bottom: 20px;
  width: 24px;
  height: 12px;
  border-bottom: 3px solid var(--color-primary-deep);
  border-radius: 0 0 20px 20px;
  transform: translateX(-50%);
}

.bottom-bar {
  position: sticky;
  bottom: 0;
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: var(--space-2);
  padding: var(--space-3);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-lg);
  background: rgba(255, 255, 255, 0.95);
  box-shadow: var(--shadow-card);
  backdrop-filter: blur(10px);
}

.bottom-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
  min-height: 48px;
  border-radius: var(--radius-md);
  color: var(--color-ink-soft);
  font-size: var(--text-xs);
  font-weight: var(--font-weight-semibold);
}

.bottom-item.active {
  background: var(--color-primary-soft);
  color: var(--color-primary-deep);
}

.touch-note {
  color: var(--color-muted);
  font-size: var(--text-xs);
  text-align: center;
}

@media (max-width: 480px) {
  .app-shell {
    padding: var(--space-3);
  }

  .hero-card,
  .panel-card,
  .lesson-card,
  .summary-card,
  .option-card,
  .unit-card {
    border-radius: var(--radius-md);
  }

  .stats-row {
    grid-template-columns: 1fr;
  }
}

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>

    <style type="text/tailwindcss">

  }
    </style>
    <style id="semantic-token-fallback">
      .bg-background { background-color: var(--color-background); }

      .text-card { color: var(--color-card); }

  <body>
    <style>
      .kid-simple-page {
        display: flex;
        flex-direction: column;
        gap: var(--space-4);
      }

      .kid-goal-card,
      .kid-word-card,
      .kid-feedback-card,
      .kid-next-card {
        background: rgba(255, 255, 255, 0.94);
        border: 1px solid var(--color-border);
        border-radius: var(--radius-lg);
        box-shadow: var(--shadow-card);
      }

      .kid-topbar {
        align-items: flex-start;
      }

      .kid-topbar-copy {
        flex: 1;
        min-width: 0;
      }

      .kid-step-note {
        margin: 0;
        color: var(--color-primary-deep);
        font-size: var(--text-sm);
        font-weight: var(--font-weight-bold);
      }

      .kid-goal-card {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 88px;
        gap: var(--space-3);
        padding: var(--space-4);
        align-items: center;
      }

      .kid-goal-title {
        margin: 0;
        font-size: clamp(26px, 6vw, 34px);
        line-height: 1.25;
        color: var(--color-ink);
      }

      .kid-goal-tip {
        margin: var(--space-2) 0 0;
        color: var(--color-ink-soft);
        font-size: var(--text-sm);
        line-height: 1.6;
      }

      .kid-progress-wrap {
        display: grid;
        gap: var(--space-2);
        margin-top: var(--space-3);
      }

      .kid-progress-label {
        display: flex;
        justify-content: space-between;
        gap: var(--space-2);
        color: var(--color-ink-soft);
        font-size: var(--text-xs);
        font-weight: var(--font-weight-semibold);
      }

      .kid-sticker {
        position: relative;
        width: 88px;
        height: 88px;
        border-radius: 28px;
        background: linear-gradient(180deg, #f7f9ff 0%, #edf3ff 100%);
        border: 1px solid var(--color-border);
        box-shadow: var(--shadow-soft);
      }

      .kid-sticker::before,
      .kid-sticker::after {
        content: "";
        position: absolute;
        top: 7px;
        width: 22px;
        height: 24px;
        border-radius: 16px 16px 10px 10px;
        background: #dce5fb;
      }

      .kid-sticker::before {
        left: 14px;
        transform: rotate(-12deg);
      }

      .kid-sticker::after {
        right: 14px;
        transform: rotate(12deg);
      }

      .kid-sticker-face {
        position: absolute;
        inset: 18px 13px 12px;
        border-radius: 28px 28px 22px 22px;
        background: #fefefe;
        border: 1px solid #e6ebf8;
      }

      .kid-sticker-eye {
        position: absolute;
        top: 26px;
        width: 8px;
        height: 12px;
        border-radius: 999px;
        background: var(--color-ink);
      }

      .kid-sticker-eye.left {
        left: 24px;
      }

      .kid-sticker-eye.right {
        right: 24px;
      }

      .kid-sticker-nose {
        position: absolute;
        left: 50%;
        top: 43px;
        width: 12px;
        height: 8px;
        border-radius: 999px;
        background: #ffb7b7;
        transform: translateX(-50%);
      }

      .kid-sticker-smile {
        position: absolute;
        left: 50%;
        bottom: 20px;
        width: 20px;
        height: 10px;
        border-bottom: 3px solid var(--color-primary-deep);
        border-radius: 0 0 16px 16px;
        transform: translateX(-50%);
      }

      .kid-sticker-scarf {
        position: absolute;
        left: 50%;
        bottom: 12px;
        width: 34px;
        height: 12px;
        border-radius: 999px;
        background: #ffd56b;
        transform: translateX(-50%);
      }

      .kid-word-card {
        overflow: hidden;
      }

      .kid-word-image {
        width: 100%;
        aspect-ratio: 16 / 10;
        object-fit: cover;
      }

      .kid-word-body {
        display: grid;
        gap: var(--space-4);
        padding: var(--space-5);
      }

      .kid-word-tag {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 28px;
        width: fit-content;
        padding: 0 var(--space-3);
        border-radius: var(--radius-pill);
        background: var(--color-primary-soft);
        color: var(--color-primary-deep);
        font-size: var(--text-xs);
        font-weight: var(--font-weight-bold);
      }

      .kid-word-main {
        display: grid;
        gap: var(--space-2);
        text-align: center;
      }

      .kid-word-en {
        margin: 0;
        font-size: clamp(48px, 12vw, 64px);
        line-height: 1;
        color: var(--color-ink);
      }

      .kid-word-pronunciation {
        color: var(--color-primary-deep);
        font-size: var(--text-md);
        font-weight: var(--font-weight-bold);
      }

      .kid-word-zh {
        margin: 0;
        color: var(--color-ink-soft);
        font-size: var(--text-base);
      }

      .kid-action-list {
        display: grid;
        gap: var(--space-3);
      }

      .kid-action-button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        min-height: 64px;
        padding: 0 var(--space-5);
        border-radius: var(--radius-pill);
        text-decoration: none;
        font-size: var(--text-md);
        font-weight: var(--font-weight-bold);
        box-shadow: var(--shadow-soft);
      }

      .kid-action-button.listen {
        background: #ffffff;
        border: 1px solid var(--color-border-strong);
        color: var(--color-primary-deep);
      }

      .kid-action-button.read {
        background: var(--primary-gradient);
        color: #ffffff;
      }

      .kid-feedback-card,
      .kid-next-card {
        padding: var(--space-4);
      }

      .kid-feedback-card {
        background: linear-gradient(180deg, #fffaf5 0%, #ffffff 100%);
      }

      .kid-feedback-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: var(--space-3);
      }

      .kid-feedback-title {
        margin: 0;
        font-size: 20px;
      }

      .kid-score-badge {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 74px;
        min-height: 40px;
        padding: 0 var(--space-3);
        border-radius: var(--radius-pill);
        background: var(--state-success-soft);
        color: var(--state-success);
        font-size: var(--text-base);
        font-weight: var(--font-weight-bold);
      }

      .kid-feedback-text {
        margin: var(--space-3) 0 0;
        color: var(--color-ink-soft);
        font-size: var(--text-base);
        line-height: 1.7;
      }

      .kid-next-card {
        display: grid;
        gap: var(--space-3);
      }

      .kid-next-tip {
        margin: 0;
        color: var(--color-muted);
        font-size: var(--text-sm);
        text-align: center;
      }

      @media (max-width: 480px) {
        .kid-goal-card {
          grid-template-columns: 1fr;
        }

        .kid-sticker {
          margin-left: auto;
        }
      }
    </style>

    <main class="app-shell mobile-frame">
      <div class="kid-simple-page">
        <header class="topbar kid-topbar">
          <a class="back-button" data-dom-id="back-unit" href="unit-kid-simple.html">返回单元</a>
          <div class="kid-topbar-copy">
            <p class="kid-step-note">第 1 步到第 3 步</p>
            <h1 class="page-title">学习页低龄简化版</h1>
            <p class="page-subtitle">一步一动作，更容易专注。</p>
          </div>
        </header>

        <section class="kid-goal-card" data-dom-id="lesson-progress" aria-label="顶部进度">
          <div>
            <h2 class="kid-goal-title">先听 apple，再跟着读</h2>
            <p class="kid-goal-tip">今天只做两件事：先听清楚，再张嘴读出来。做完就能进入下一步。</p>
            <div class="kid-progress-wrap">
              <div class="kid-progress-label">
                <span>当前进度</span>
                <span>1 / 3</span>
              </div>
              <div class="progress-track" aria-label="学习进度">
                <div class="progress-fill" style="width: 34%;"></div>
              </div>
            </div>
          </div>
          <div class="kid-sticker" aria-hidden="true">
            <div class="kid-sticker-face"></div>
            <div class="kid-sticker-eye left"></div>
            <div class="kid-sticker-eye right"></div>
            <div class="kid-sticker-nose"></div>
            <div class="kid-sticker-smile"></div>
            <div class="kid-sticker-scarf"></div>
          </div>
        </section>

        <section class="kid-word-card" data-dom-id="word-card" aria-label="单词主卡">
          <img class="kid-word-image" src="../assets/hero-fruit-apple.jpg" alt="apple 的水果图片" />
          <div class="kid-word-body">
            <span class="kid-word-tag">本次学习词</span>
            <div class="kid-word-main">
              <h2 class="kid-word-en">apple</h2>
              <div class="kid-word-pronunciation">/ˈæp.əl/</div>
              <p class="kid-word-zh">苹果</p>
            </div>
            <div class="kid-action-list" aria-label="两个学习动作">
              <a class="kid-action-button listen" data-dom-id="action-listen" href="#">听一听</a>
              <a class="kid-action-button read" data-dom-id="action-read" href="#">跟我读</a>
            </div>
          </div>
        </section>

        <section class="kid-feedback-card" data-dom-id="score-feedback" aria-label="得分反馈">
          <div class="kid-feedback-head">
            <h2 class="kid-feedback-title">做得很好</h2>
            <span class="kid-score-badge">95 分</span>
          </div>
          <p class="kid-feedback-text">你已经把 apple 听清楚了，也能跟着读出来。再读一遍，会更顺口。</p>
        </section>

        <section class="kid-next-card" data-dom-id="next-step" aria-label="下一步">
          <a class="primary-button" href="#">下一步</a>
          <p class="kid-next-tip">完成这张卡，就去下一张。</p>
        </section>
      </div>
    </main>
  </body>
</html>
