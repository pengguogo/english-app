<!DOCTYPE html>
<html lang="zh-CN" class="light">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>主题页低龄简化版</title>
    <style id="theme-vars">
:root {
  --color-primary: #6b7cff;
  --color-primary-deep: #4f61da;
  --color-primary-soft: #eef2ff;
  --state-success: #55b86f;
  --state-success-soft: #edf8f0;
  --state-warning: #ff9c41;
  --state-warning-soft: #fff3e7;
  --state-error: #ef7878;
  --state-error-soft: #ffefef;
  --state-info: #78a8ef;
  --state-info-soft: #eff6ff;
  --color-ink: #27314d;
  --color-ink-soft: #59627d;
  --color-muted: #8d95ad;
  --color-border: #e6eaf5;
  --color-border-strong: #d7dff0;
  --color-background: #fff8f1;
  --color-background-soft: #fffdf9;
  --color-card: #ffffff;
  --color-card-soft: #f9fbff;
  --color-foreground: var(--color-ink);
  --shadow-card: 0 10px 24px rgba(39, 49, 77, 0.04);
  --shadow-soft: 0 6px 18px rgba(39, 49, 77, 0.035);
  --shadow-press: 0 8px 18px rgba(79, 97, 218, 0.05);
  --radius-xs: 6px;
  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-lg: 16px;
  --radius-pill: 999px;
  --color-radius-sm: var(--radius-sm);
  --color-radius-md: var(--radius-md);
  --color-radius-lg: var(--radius-lg);
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 20px;
  --space-6: 24px;
  --space-8: 32px;
  --space-10: 40px;
  --text-xs: 12px;
  --text-sm: 14px;
  --text-base: 16px;
  --text-md: 18px;
  --text-lg: 24px;
  --text-xl: 30px;
  --font-sans: "PingFang SC", "Noto Sans SC", system-ui, -apple-system, sans-serif;
  --font-weight-medium: 500;
  --font-weight-semibold: 600;
  --font-weight-bold: 700;
  --duration-fast: 150ms;
  --duration-normal: 220ms;
  --ease-smooth: cubic-bezier(0.4, 0, 0.2, 1);
  --primary-gradient: linear-gradient(135deg, #6b7cff 0%, #88a0ff 100%);
  --soft-gradient: linear-gradient(180deg, #fffdf9 0%, #fff5eb 100%);
  --focus-ring: 0 0 0 4px rgba(107, 124, 255, 0.16);
}

*,
*::before,
*::after {
  box-sizing: border-box;
}

html {
  font-size: 16px;
}

body {
  margin: 0;
  min-height: 100vh;
  font-family: var(--font-sans);
  color: var(--color-foreground);
  background: var(--soft-gradient);
}

img {
  display: block;
  max-width: 100%;
}

button,
a {
  color: inherit;
  font: inherit;
}

.app-shell {
  width: min(100%, 800px);
  margin: 0 auto;
  padding: var(--space-4);
}

.mobile-frame {
  min-height: 100vh;
  background: linear-gradient(180deg, rgba(255, 255, 255, 0.74), rgba(255, 255, 255, 0.94)), var(--color-background);
}

.page-stack {
  display: flex;
  flex-direction: column;
  gap: var(--space-4);
  padding-bottom: 110px;
}

.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-3);
  padding: var(--space-3) 0;
}

.back-button,
.ghost-button,
.chip-button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-height: 44px;
  padding: 0 var(--space-4);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-pill);
  background: rgba(255, 255, 255, 0.92);
  text-decoration: none;
  box-shadow: var(--shadow-soft);
}

.page-title {
  margin: 0;
  font-size: var(--text-md);
  font-weight: var(--font-weight-bold);
}

.page-subtitle {
  margin: 2px 0 0;
  color: var(--color-ink-soft);
  font-size: var(--text-sm);
}

.hero-card,
.panel-card,
.lesson-card,
.summary-card,
.option-card,
.unit-card {
  background: var(--color-card);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-card);
}

.hero-card {
  padding: var(--space-5);
}

.section-title {
  margin: 0;
  font-size: 20px;
  font-weight: var(--font-weight-bold);
}

.section-desc {
  margin: var(--space-1) 0 0;
  color: var(--color-ink-soft);
  font-size: var(--text-sm);
}

.stats-row {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: var(--space-3);
}

.stat-card {
  padding: var(--space-3);
  border-radius: var(--radius-md);
  background: var(--color-card-soft);
  border: 1px solid var(--color-border);
}

.stat-label {
  display: block;
  color: var(--color-muted);
  font-size: var(--text-xs);
}

.stat-value {
  display: block;
  margin-top: var(--space-1);
  font-size: var(--text-md);
  font-weight: var(--font-weight-bold);
}

.primary-button,
.action-button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 100%;
  min-height: 52px;
  padding: 0 var(--space-5);
  border: 0;
  border-radius: var(--radius-pill);
  background: var(--primary-gradient);
  color: #ffffff;
  text-decoration: none;
  font-size: var(--text-base);
  font-weight: var(--font-weight-bold);
  box-shadow: var(--shadow-press);
}

.secondary-button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 100%;
  min-height: 48px;
  padding: 0 var(--space-4);
  border: 1px solid var(--color-border-strong);
  border-radius: var(--radius-pill);
  background: #ffffff;
  color: var(--color-primary-deep);
  text-decoration: none;
  font-size: var(--text-sm);
  font-weight: var(--font-weight-bold);
}

.badge {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-height: 28px;
  padding: 0 var(--space-3);
  border-radius: var(--radius-pill);
  font-size: var(--text-xs);
  font-weight: var(--font-weight-bold);
}

.badge-success {
  background: var(--state-success-soft);
  color: var(--state-success);
}

.badge-warning {
  background: var(--state-warning-soft);
  color: var(--state-warning);
}

.badge-info {
  background: var(--state-info-soft);
  color: var(--state-info);
}

.progress-track {
  width: 100%;
  height: 10px;
  overflow: hidden;
  border-radius: var(--radius-pill);
  background: #eef1f8;
}

.progress-fill {
  height: 100%;
  border-radius: var(--radius-pill);
  background: var(--primary-gradient);
}

.simple-mascot {
  position: relative;
  width: 92px;
  height: 92px;
  flex-shrink: 0;
  border-radius: 32px;
  background: linear-gradient(180deg, #f6f8ff 0%, #edf2ff 100%);
  border: 1px solid var(--color-border);
  box-shadow: var(--shadow-soft);
}

.simple-mascot::before,
.simple-mascot::after {
  content: "";
  position: absolute;
  top: 8px;
  width: 22px;
  height: 22px;
  border-radius: 50%;
  background: #d9dfef;
}

.simple-mascot::before {
  left: 12px;
}

.simple-mascot::after {
  right: 12px;
}

.simple-mascot-face {
  position: absolute;
  inset: 18px 14px 10px;
  border-radius: 28px 28px 24px 24px;
  background: #f3f6ff;
  border: 1px solid #e2e8f5;
}

.simple-mascot-eye {
  position: absolute;
  top: 22px;
  width: 10px;
  height: 14px;
  border-radius: 999px;
  background: var(--color-ink);
}

.simple-mascot-eye.left {
  left: 22px;
}

.simple-mascot-eye.right {
  right: 22px;
}

.simple-mascot-nose {
  position: absolute;
  top: 42px;
  left: 50%;
  width: 14px;
  height: 10px;
  border-radius: 999px;
  background: #ffb8b8;
  transform: translateX(-50%);
}

.simple-mascot-smile {
  position: absolute;
  left: 50%;
  bottom: 20px;
  width: 24px;
  height: 12px;
  border-bottom: 3px solid var(--color-primary-deep);
  border-radius: 0 0 20px 20px;
  transform: translateX(-50%);
}

.bottom-bar {
  position: sticky;
  bottom: 0;
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: var(--space-2);
  padding: var(--space-3);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-lg);
  background: rgba(255, 255, 255, 0.95);
  box-shadow: var(--shadow-card);
  backdrop-filter: blur(10px);
}

.bottom-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
  min-height: 48px;
  border-radius: var(--radius-md);
  color: var(--color-ink-soft);
  font-size: var(--text-xs);
  font-weight: var(--font-weight-semibold);
}

.bottom-item.active {
  background: var(--color-primary-soft);
  color: var(--color-primary-deep);
}

.touch-note {
  color: var(--color-muted);
  font-size: var(--text-xs);
  text-align: center;
}

@media (max-width: 480px) {
  .app-shell {
    padding: var(--space-3);
  }

  .hero-card,
  .panel-card,
  .lesson-card,
  .summary-card,
  .option-card,
  .unit-card {
    border-radius: var(--radius-md);
  }

  .stats-row {
    grid-template-columns: 1fr;
  }
}

    </style>

  <body>
    <style>
      .kid-theme-page {
        display: flex;
        flex-direction: column;
        gap: var(--space-4);
      }

      .back-button {
        gap: var(--space-2);
      }

      .back-button::before {
        content: "";
        width: 10px;
        height: 10px;
        border-left: 2px solid var(--color-primary-deep);
        border-bottom: 2px solid var(--color-primary-deep);
        transform: rotate(45deg);
        margin-top: -1px;
      }

      .hero-guide {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 110px;
        gap: var(--space-4);
        align-items: center;
      }

      .hero-copy {
        display: flex;
        flex-direction: column;
        gap: var(--space-3);
      }

      .hero-tag,
      .unit-tag,
      .wait-tag {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: fit-content;
        min-height: 30px;
        padding: 0 var(--space-3);
        border-radius: var(--radius-pill);
        font-size: var(--text-xs);
        font-weight: var(--font-weight-bold);
      }

      .hero-tag {
        background: var(--color-primary-soft);
        color: var(--color-primary-deep);
      }

      .hero-title {
        margin: 0;
        font-size: clamp(28px, 6vw, 36px);
        line-height: 1.2;
      }

      .hero-desc {
        margin: 0;
        color: var(--color-ink-soft);
        font-size: var(--text-base);
        line-height: 1.6;
      }

      .hero-prompt {
        display: inline-flex;
        align-items: center;
        width: fit-content;
        min-height: 38px;
        padding: 0 var(--space-4);
        border-radius: var(--radius-pill);
        background: var(--state-warning-soft);
        color: var(--state-warning);
        font-size: var(--text-sm);
        font-weight: var(--font-weight-bold);
      }

      .sticker-wrap {
        position: relative;
        display: grid;
        place-items: center;
        width: 110px;
        height: 110px;
        padding: 10px;
        border-radius: 32px;
        background:
          radial-gradient(circle at top right, rgba(255, 255, 255, 0.95), rgba(255, 255, 255, 0.55) 55%, transparent 56%),
          linear-gradient(180deg, #fffaf5 0%, #fff1e4 100%);
        border: 1px solid var(--color-border);
        box-shadow: var(--shadow-soft);
      }

      .sticker-wrap::after {
        content: "";
        position: absolute;
        right: 14px;
        bottom: 14px;
        width: 20px;
        height: 28px;
        border-radius: 12px 12px 16px 16px;
        background: linear-gradient(180deg, #ffd84f 0%, #ffc93d 100%);
        box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.45);
      }

      .hero-media {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 84px;
        gap: var(--space-3);
        align-items: stretch;
      }

      .hero-cover,
      .hero-side-image,
      .unit-thumb {
        width: 100%;
        object-fit: cover;
        border-radius: var(--radius-lg);
        display: block;
      }

      .hero-cover {
        aspect-ratio: 16 / 9;
      }

      .hero-side-image {
        height: 100%;
        min-height: 140px;
      }

      .step-board {
        display: grid;
        gap: var(--space-4);
      }

      .step-intro {
        display: flex;
        flex-direction: column;
        gap: var(--space-1);
      }

      .step-title {
        margin: 0;
        font-size: 22px;
      }

      .step-desc {
        margin: 0;
        color: var(--color-ink-soft);
        font-size: var(--text-sm);
      }

      .primary-unit {
        padding: var(--space-4);
        border-radius: 24px;
        background:
          linear-gradient(180deg, rgba(255, 255, 255, 0.94), rgba(255, 249, 240, 0.98)),
          var(--color-card);
        border: 2px solid rgba(107, 124, 255, 0.18);
        box-shadow: 0 16px 32px rgba(79, 97, 218, 0.08);
      }

      .primary-unit-layout {
        display: grid;
        grid-template-columns: 120px minmax(0, 1fr);
        gap: var(--space-4);
        align-items: center;
      }

      .unit-thumb {
        aspect-ratio: 1 / 1;
        background: var(--color-card-soft);
        border: 1px solid var(--color-border);
      }

      .unit-content {
        display: grid;
        gap: var(--space-3);
      }

      .unit-head {
        display: flex;
        align-items: start;
        justify-content: space-between;
        gap: var(--space-3);
      }

      .unit-title {
        margin: 0;
        font-size: 24px;
      }

      .unit-line {
        margin: 0;
        color: var(--color-ink-soft);
        font-size: var(--text-base);
      }

      .unit-progress {
        display: grid;
        gap: var(--space-2);
      }

      .progress-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: var(--space-3);
        color: var(--color-ink-soft);
        font-size: var(--text-sm);
      }

      .unit-tag {
        background: var(--state-success-soft);
        color: var(--state-success);
      }

      .secondary-board {
        display: grid;
        gap: var(--space-3);
      }

      .secondary-label {
        margin: 0;
        color: var(--color-muted);
        font-size: var(--text-sm);
        font-weight: var(--font-weight-semibold);
      }

      .secondary-grid {
        display: grid;
        gap: var(--space-3);
      }

      .secondary-unit {
        display: grid;
        grid-template-columns: 84px minmax(0, 1fr);
        gap: var(--space-3);
        align-items: center;
        padding: var(--space-3);
        background: rgba(255, 255, 255, 0.72);
        border: 1px solid var(--color-border);
        border-radius: 20px;
        opacity: 0.82;
      }

      .secondary-unit .unit-thumb {
        border-radius: 18px;
      }

      .secondary-content {
        display: grid;
        gap: var(--space-2);
      }

      .secondary-content .unit-title {
        font-size: 18px;
      }

      .wait-tag {
        background: var(--color-card-soft);
        color: var(--color-muted);
        border: 1px solid var(--color-border);
      }

      .wait-status {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: fit-content;
        min-height: 38px;
        padding: 0 var(--space-4);
        border-radius: var(--radius-pill);
        background: rgba(255, 255, 255, 0.9);
        border: 1px solid var(--color-border-strong);
        color: var(--color-ink-soft);
        font-size: var(--text-sm);
        font-weight: var(--font-weight-bold);
      }

      .teacher-note {
        padding: var(--space-4);
        border-radius: var(--radius-lg);
        background: var(--color-card-soft);
        border: 1px dashed var(--color-border-strong);
      }

      .teacher-note p {
        margin: 0;
        color: var(--color-ink-soft);
        line-height: 1.6;
      }

      @media (max-width: 479px) {
        .hero-guide,
        .hero-media,
        .primary-unit-layout,
        .secondary-unit {
          grid-template-columns: 1fr;
        }

        .sticker-wrap {
          justify-self: center;
        }

        .hero-side-image {
          min-height: 120px;
        }

        .unit-head {
          flex-direction: column;
          align-items: start;
        }
      }
    </style>

    <main class="app-shell mobile-frame">
      <div class="page-stack kid-theme-page">
        <header class="topbar">
          <a class="back-button" data-dom-id="back-home" href="home-kid-simple.html">返回首页</a>
          <div>
            <p class="page-title">水果主题</p>
            <p class="page-subtitle">一步一步学</p>
          </div>
        </header>

        <section class="hero-card" aria-label="主题横幅">
          <div class="hero-guide">
            <div class="hero-copy">
              <span class="hero-tag">老师带你学</span>
              <div>
                <h1 class="hero-title">先学第一章</h1>
                <p class="hero-desc">先认最常见的水果，再慢慢往后学。</p>
              </div>
              <span class="hero-prompt">先点下面大按钮</span>
            </div>

            <div class="sticker-wrap" aria-hidden="true">
              <div class="simple-mascot">
                <div class="simple-mascot-face"></div>
                <span class="simple-mascot-eye left"></span>
                <span class="simple-mascot-eye right"></span>
                <span class="simple-mascot-nose"></span>
                <span class="simple-mascot-smile"></span>
              </div>
            </div>
          </div>

          <div class="hero-media">
            <img class="hero-cover" src="../assets/hero-fruit-apple.jpg" alt="水果主题主画面" />
            <img class="hero-side-image" src="../assets/unit-fruit-market.webp" alt="第一章水果市场" />
          </div>
        </section>

        <section class="step-board" aria-label="主题单元列表">
          <div class="step-intro">
            <h2 class="step-title">今天就做这一件事</h2>
            <p class="step-desc">做完第一章，后面两章再来。</p>
          </div>

          <article class="primary-unit unit-card">
