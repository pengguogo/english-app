<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" aria-hidden="true" focusable="false">
  <!-- 学习伙伴「豆豆」圆润扁平：大圆耳 + 粉腮 + 卷尾。造型起点 Fluent Emoji mouse_face_flat（MIT），已重画比例并加身体与手势。 -->
  <!-- 色值全部是 CSS 变量，由 CompanionMouse.vue 映射到 tokens.css；data-s 标记该元素属于哪些状态。 -->
  <path d="M68 90 C86 94 94 82 86 74 C82 70 77 74 80 78" fill="none" stroke="var(--cm-body-dark)" stroke-width="3" stroke-linecap="round"/>
  <ellipse cx="50" cy="86" rx="21" ry="13" fill="var(--cm-body)"/>
  <ellipse cx="50" cy="89" rx="12" ry="8" fill="var(--cm-belly)"/>
  <g class="cm-head">
    <g class="cm-ear-l"><circle cx="25" cy="30" r="17" fill="var(--cm-body)"/><circle cx="25" cy="30" r="10.5" fill="var(--cm-inner)"/></g>
    <g class="cm-ear-r"><circle cx="75" cy="30" r="17" fill="var(--cm-body)"/><circle cx="75" cy="30" r="10.5" fill="var(--cm-inner)"/></g>
    <ellipse cx="50" cy="54" rx="27" ry="24" fill="var(--cm-body)"/>
    <circle cx="32" cy="62" r="4.5" fill="var(--cm-inner)"/>
    <circle cx="68" cy="62" r="4.5" fill="var(--cm-inner)"/>
    <!-- 眼睛 -->
    <g data-s="idle" class="cm-blink" fill="var(--cm-ink)">
      <ellipse cx="40" cy="52" rx="3.6" ry="4.4"/><ellipse cx="60" cy="52" rx="3.6" ry="4.4"/>
      <circle cx="41.3" cy="50.4" r="1.2" fill="var(--cm-white)"/><circle cx="61.3" cy="50.4" r="1.2" fill="var(--cm-white)"/>
    </g>
    <g data-s="listening" class="cm-blink" fill="var(--cm-ink)">
      <ellipse cx="42" cy="51" rx="4.2" ry="5.2"/><ellipse cx="62" cy="51" rx="4.2" ry="5.2"/>
      <circle cx="43.6" cy="49.2" r="1.4" fill="var(--cm-white)"/><circle cx="63.6" cy="49.2" r="1.4" fill="var(--cm-white)"/>
    </g>
    <g data-s="thinking" fill="var(--cm-ink)">
      <ellipse cx="38" cy="48" rx="3.4" ry="4"/><ellipse cx="58" cy="48" rx="3.4" ry="4"/>
      <path d="M33 41 L43 40" stroke="var(--cm-ink)" stroke-width="2" stroke-linecap="round"/>
    </g>
    <g data-s="cheer" fill="none" stroke="var(--cm-ink)" stroke-width="3" stroke-linecap="round">
      <path d="M35 53 Q40 46 45 53"/><path d="M55 53 Q60 46 65 53"/>
    </g>
    <g data-s="safety" class="cm-blink" fill="var(--cm-ink)">
      <circle cx="40" cy="53" r="3.8"/><circle cx="60" cy="53" r="3.8"/>
    </g>
    <g data-s="safety" fill="none" stroke="var(--cm-ink)" stroke-width="2" stroke-linecap="round">
      <path d="M34 46 L44 43"/><path d="M66 46 L56 43"/>
    </g>
    <ellipse cx="50" cy="61" rx="3.4" ry="2.6" fill="var(--cm-nose)"/>
    <g stroke="var(--cm-body-dark)" stroke-width="1.4" stroke-linecap="round">
      <path d="M29 59 L19 57"/><path d="M29 63 L19 65"/><path d="M71 59 L81 57"/><path d="M71 63 L81 65"/>
    </g>
    <!-- 嘴巴 -->
    <g fill="none" stroke="var(--cm-ink)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path data-s="idle" d="M45 65 Q47.5 68 50 65 Q52.5 68 55 65"/>
      <path data-s="thinking" d="M46 67 Q49 65 52 67 Q54 68 55 66"/>
      <path data-s="safety" d="M45 66.5 Q50 69 55 66.5"/>
    </g>
    <ellipse data-s="listening" cx="50" cy="67" rx="2.2" ry="2.6" fill="var(--cm-ink)"/>
    <g data-s="cheer"><path d="M42 65 Q50 76 58 65 Z" fill="var(--cm-ink)"/><ellipse cx="50" cy="70.5" rx="3.5" ry="1.8" fill="var(--cm-inner)"/></g>
  </g>
  <!-- 手臂与爪子 -->
  <g stroke="var(--cm-body)" stroke-width="7" stroke-linecap="round" fill="var(--cm-paw)">
    <g data-s="idle"><circle cx="38" cy="83" r="5" stroke="none"/><circle cx="62" cy="83" r="5" stroke="none"/></g>
    <g data-s="listening"><circle cx="38" cy="83" r="5" stroke="none"/><path d="M63 80 L80 54" fill="none"/><circle cx="81" cy="51" r="5.5" stroke="none"/></g>
    <g data-s="thinking"><circle cx="38" cy="83" r="5" stroke="none"/><path d="M66 84 L62 80" fill="none"/><ellipse cx="59" cy="78.5" rx="6" ry="4.5" stroke="none"/></g>
    <g data-s="cheer"><path d="M36 80 L19 62" fill="none"/><path d="M64 80 L81 62" fill="none"/><circle cx="17" cy="59" r="5.5" stroke="none"/><circle cx="83" cy="59" r="5.5" stroke="none"/></g>
    <g data-s="safety"><circle cx="38" cy="83" r="5" stroke="none"/><path d="M64 80 L80 68" fill="none"/><ellipse cx="83" cy="63" rx="6" ry="7" stroke="none"/></g>
  </g>
  <!-- 状态特效 -->
  <g data-s="listening" class="cm-fx" fill="none" stroke="var(--cm-fx)" stroke-width="2.5" stroke-linecap="round">
    <path d="M90 40 Q94 46 90 52"/><path d="M95 35 Q101 46 95 57"/>
  </g>
  <g data-s="thinking" class="cm-dots" fill="var(--cm-fx)">
    <circle cx="43" cy="12" r="2.8"/><circle cx="50" cy="10" r="2.8"/><circle cx="57" cy="12" r="2.8"/>
  </g>
  <g data-s="cheer" class="cm-stars" fill="var(--cm-accent)">
    <path d="M10 38 Q10 44 16 44 Q10 44 10 50 Q10 44 4 44 Q10 44 10 38 Z"/>
    <path d="M90 36 Q90 42 96 42 Q90 42 90 48 Q90 42 84 42 Q90 42 90 36 Z"/>
    <path d="M50 2 Q50 7 55 7 Q50 7 50 12 Q50 7 45 7 Q50 7 50 2 Z"/>
  </g>
  <g data-s="safety" class="cm-badge">
    <path d="M16 64 L25 67.5 V74 C25 79 21 82 16 84 C11 82 7 79 7 74 V67.5 Z" fill="var(--cm-alert)"/>
    <path d="M16 68.5 V75" stroke="var(--cm-white)" stroke-width="2.6" stroke-linecap="round"/>
    <circle cx="16" cy="79" r="1.4" fill="var(--cm-white)"/>
  </g>
</svg>
